services:
  # ==========================================
  # INFRAESTRUCTURA COMPARTIDA
  # ==========================================
  
  shared-redis:
    image: redis:7-alpine
    container_name: shared_redis
    ports:
      - "6379:6379"
    volumes:
      - shared_redis_data:/data
    networks:
      - agent_network

  shared_postgres:
    image: postgres:15-alpine
    container_name: shared_postgres
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-shared_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-shared_pass}
      - POSTGRES_DB=${POSTGRES_DB:-intecmar_db}
    ports:
      - "5432:5432"
    volumes:
      - shared_postgres_data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql
    networks:
      - agent_network

  shared-minio:
    image: minio/minio
    container_name: shared-minio
    ports:
      - "9000:9000"   # Puerto API S3
      - "9001:9001"   # Consola Web (UI)
    environment:
      - MINIO_ROOT_USER=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_ROOT_PASSWORD=${MINIO_SECRET_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - shared_minio_data:/data
    networks:
      - agent_network

  chromadb:
    image: chromadb/chroma:latest
    container_name: chromadb
    ports:
      - "8001:8000"
    volumes:
      - chromadb_data:/chroma/chroma
    networks:
      - agent_network
    environment:
      - IS_PERSISTENT=TRUE
      - ANONYMIZED_TELEMETRY=FALSE

  # ==========================================
  # INTECMAR API (Núcleo Unificado)
  # ==========================================

  intecmar_api:
    build: 
      context: ./Intecmar_api
    container_name: intecmar_api
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload --reload-exclude outputs/*
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=${REDIS_URL:-redis://shared_redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://shared_user:shared_pass@shared_postgres:5432/intecmar_db}
      - JWT_SECRET=${JWT_SECRET:-change-me}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://shared-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_SECURE=${MINIO_SECURE:-False}
      - MINIO_BUCKET_USERS=${MINIO_BUCKET_USERS:-users}
      # ChromaDB config
      - CHROMA_HOST=${CHROMA_HOST:-chromadb}
      - CHROMA_PORT=${CHROMA_PORT:-8000}
      # Agent specific envs
      - CELERY_BROKER_URL=${REDIS_URL:-redis://shared_redis:6379/0}
      - CELERY_RESULT_BACKEND=${REDIS_URL:-redis://shared_redis:6379/0}
      - SHARED_DATA_PATH=${SHARED_DATA_PATH:-/app/backend/shared_data}
    volumes:
      - ./Intecmar_api:/app
    depends_on:
      - shared-redis
      - shared_postgres
      - chromadb
    networks:
      - agent_network

  # ==========================================
  # INTECMAR WORKERS (Revista y Agente)
  # ==========================================

  magazine_worker:
    build: 
      context: ./Intecmar_api
    container_name: magazine_worker
    command: celery -A backend.app.workers.magazine.celery_app worker -Q magazine -l info -c 1
    env_file:
      - .env
    environment:
      - PYTHONPATH=/app
      - REDIS_URL=${REDIS_URL:-redis://shared_redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://shared_user:shared_pass@shared_postgres:5432/intecmar_db}
      - API_INTERNAL_URL=${API_INTERNAL_URL:-http://intecmar_api:8000}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://shared-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_SECURE=${MINIO_SECURE:-False}
      - CELERY_BROKER_URL=${REDIS_URL:-redis://shared_redis:6379/0}
      - CELERY_RESULT_BACKEND=${REDIS_URL:-redis://shared_redis:6379/0}

    volumes:
      - ./Intecmar_api:/app
    depends_on:
      - shared-redis
      - shared_postgres
    networks:
      - agent_network

  agent-worker:
    build: 
      context: ./Intecmar_api
    container_name: agent_worker
    command: celery -A backend.app.workers.tech_surveillance.celery_app worker -Q agent -l info
    env_file: 
      - .env
    environment:
      - PYTHONPATH=/app
      - CELERY_BROKER_URL=${REDIS_URL:-redis://shared_redis:6379/0}
      - CELERY_RESULT_BACKEND=${REDIS_URL:-redis://shared_redis:6379/0}
      - DATABASE_URL=${DATABASE_URL:-postgresql+psycopg2://shared_user:shared_pass@shared_postgres:5432/intecmar_db}
      - SHARED_DATA_PATH=${SHARED_DATA_PATH:-/app/backend/shared_data}
      - MINIO_ENDPOINT=${MINIO_ENDPOINT:-http://shared-minio:9000}
      - MINIO_ACCESS_KEY=${MINIO_ACCESS_KEY:-minioadmin}
      - MINIO_SECRET_KEY=${MINIO_SECRET_KEY:-minioadmin}
      - MINIO_BUCKET=${MINIO_BUCKET:-agent-results}
      # ChromaDB config
      - CHROMA_HOST=${CHROMA_HOST:-chromadb}
      - CHROMA_PORT=${CHROMA_PORT:-8000}
    volumes:
      - ./Intecmar_api:/app
    depends_on:
      - shared-redis
      - shared-minio
      - shared_postgres
      - chromadb
    networks:
      - agent_network

  # ==========================================
  # MONITOREO Y LOGS (Grafana + Loki)
  # ==========================================

  loki:
    image: grafana/loki:3.0.0
    container_name: loki
    user: root
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki/config.yml:/etc/loki/local-config.yaml
      - loki_data:/tmp/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - agent_network

  promtail:
    image: grafana/promtail:3.0.0
    container_name: promtail
    volumes:
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    networks:
      - agent_network
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    networks:
      - agent_network
    depends_on:
      - loki

volumes:
  shared_redis_data:
  shared_postgres_data:
  shared_minio_data:
  chromadb_data:
  loki_data:
  grafana_data:

networks:
  agent_network:
    driver: bridge

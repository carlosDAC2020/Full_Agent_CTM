<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Contraseña | Magazine App</title>
    <link rel="icon" href="/assets/logo-cotecmar.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        /* Reusing Login Styles for consistency */
        :root {
            --primary: #0f4c81;
            --primary-dark: #092e4f;
            --accent: #2c93d8;
            --text-main: #1f2937;
            --text-light: #6b7280;
            --bg-right: #f3f4f6;
            --glass-bg: rgba(255, 255, 255, 0.9);
            --glass-border: rgba(255, 255, 255, 1);
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
            --radius: 16px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
        }

        .split-left {
            flex: 1.8;
            position: relative;
            overflow: hidden;
            background-color: #000;
        }

        .bg-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.7;
        }

        .video-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to bottom, rgba(15, 76, 129, 0.4), rgba(0, 0, 0, 0.6));
            z-index: 1;
        }

        .brand-caption {
            position: absolute;
            bottom: 40px;
            left: 40px;
            z-index: 2;
            color: #fff;
            max-width: 500px;
        }

        .brand-caption h2 {
            font-size: 2.4rem;
            font-weight: 700;
            margin-bottom: 10px;
        }

        .brand-caption p {
            font-size: 1.05rem;
            opacity: 0.9;
            font-weight: 300;
        }

        .split-right {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--bg-right);
            padding: 20px;
            position: relative;
        }

        .auth-card {
            width: 100%;
            max-width: 400px;
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 2.5rem 2rem;
            position: relative;
            z-index: 10;
        }

        .header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-container {
            width: 70px;
            height: 70px;
            margin: 0 auto 1rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo {
            max-width: 100%;
            max-height: 100%;
            object-fit: contain;
        }

        .title {
            font-size: 1.4rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.3rem;
        }

        .subtitle {
            font-size: 0.85rem;
            color: var(--text-light);
        }

        .input-group {
            margin-bottom: 1.2rem;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 0.4rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-light);
            font-size: 1.2rem;
        }

        .styled-input {
            width: 100%;
            padding: 12px 12px 12px 42px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.2s;
            background: white;
        }

        .styled-input:focus {
            outline: none;
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(44, 147, 216, 0.15);
        }

        .btn-primary {
            width: 100%;
            padding: 12px;
            background: var(--primary);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: var(--primary-dark);
        }

        .btn-primary:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .auth-footer {
            margin-top: 1.5rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-light);
        }

        .link {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
        }

        .error-msg {
            background-color: #fef2f2;
            border: 1px solid #fecaca;
            color: #b91c1c;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }

        .success-msg {
            background-color: #ecfdf5;
            border: 1px solid #a7f3d0;
            color: #065f46;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
            text-align: center;
        }

        @media (max-width: 900px) {
            .split-left {
                display: none;
            }

            .split-right {
                background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            }
        }
    </style>
</head>

<body>
    <div class="split-left">
        <video class="bg-video" autoplay loop muted playsinline poster="/assets/poster.png">
            <source src="/assets/home.mp4" type="video/mp4">
        </video>
        <div class="video-overlay"></div>
        <div class="brand-caption">
            <h2>Recuperación de Cuenta</h2>
            <p>Restablece tu acceso a la plataforma de Vigilancia Tecnológica.</p>
        </div>
    </div>

    <div class="split-right">
        <div class="auth-card">
            <header class="header">
                <div class="logo-container">
                    <img src="/assets/logo-cotecmar.png" onerror="this.src='/img/logo-cotecmar.png'" alt="Logo"
                        class="logo" />
                </div>
                <h1 class="title">¿Olvidaste tu contraseña?</h1>
                <p class="subtitle">Ingresa tu correo para recibir instrucciones</p>
            </header>

            <div id="msgSuccess" class="success-msg"></div>
            <div id="msgError" class="error-msg"></div>

            <form id="forgotForm">
                <div class="input-group">
                    <label for="email">Correo Electrónico</label>
                    <div class="input-wrapper">
                        <i class="ph ph-envelope-simple"></i>
                        <input id="email" class="styled-input" type="email" placeholder="usuario@dominio.com" required
                            autocomplete="email" />
                    </div>
                </div>

                <button id="submitBtn" class="btn-primary" type="submit">
                    <span>Enviar enlace</span>
                    <i class="ph ph-paper-plane-right"></i>
                </button>
            </form>

            <div class="auth-footer">
                <a href="/login" class="link">Volver al inicio de sesión</a>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value.trim();
            const btn = document.getElementById('submitBtn');
            const msgSuccess = document.getElementById('msgSuccess');
            const msgError = document.getElementById('msgError');
            const originalText = btn.querySelector('span').textContent;

            if (!email) return;

            btn.disabled = true;
            btn.querySelector('span').textContent = 'Enviando...';
            msgSuccess.style.display = 'none';
            msgError.style.display = 'none';

            try {
                const res = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });

                if (res.ok) {
                    msgSuccess.textContent = 'Si el correo existe, recibirás las instrucciones en breve.';
                    msgSuccess.style.display = 'block';
                    document.getElementById('email').value = '';
                } else {
                    // Even if generic error, maybe network?
                    // Don't leak user existence here, but backend returns 200 usually.
                    const data = await res.json();
                    throw new Error(data.message || 'Error al procesar solicitud');
                }
            } catch (err) {
                msgError.textContent = 'Error de conexión. Inténtalo de nuevo.';
                msgError.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.querySelector('span').textContent = originalText;
            }
        });
    </script>
</body>

</html>

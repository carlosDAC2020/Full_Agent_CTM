<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil | Magazine App</title>
    <link rel="icon" href="/assets/logo-cotecmar.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        /* Specific overrides for Profile Page */
        body {
            background-color: #f3f4f6;
            min-height: 100vh;
        }

        .container {
            padding-top: 20px;
        }

        .profile-wrapper {
            max-width: 1000px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: 300px 1fr;
            gap: 24px;
            margin-top: 40px;
        }

        .profile-card {
            background: rgba(255, 255, 255, 0.9);
            border: 1px solid rgba(255, 255, 255, 1);
            backdrop-filter: blur(20px);
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        /* Left Column: Avatar & Basic Info */
        .profile-sidebar {
            text-align: center;
        }

        .avatar-upload {
            position: relative;
            width: 150px;
            height: 150px;
            margin: 0 auto 20px;
        }

        .avatar-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            background-color: #e5e7eb;
        }

        .avatar-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0, 0, 0, 0.5);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.2s;
            cursor: pointer;
            color: white;
            font-size: 1.5rem;
        }

        .avatar-upload:hover .avatar-overlay {
            opacity: 1;
        }

        .user-name {
            font-size: 1.5rem;
            font-weight: 700;
            color: #1f2937;
            margin-bottom: 4px;
        }

        .user-role {
            font-size: 0.9rem;
            color: #6b7280;
            margin-bottom: 20px;
            font-weight: 500;
        }

        /* Right Column: Forms */
        .section-title {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f4c81;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 24px;
        }

        .full-width {
            grid-column: span 2;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            color: #374151;
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid #d1d5db;
            border-radius: 8px;
            font-size: 0.95rem;
            transition: all 0.2s;
        }

        .form-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }

        textarea.form-input {
            resize: vertical;
            min-height: 100px;
        }

        .btn-save {
            background: #0f4c81;
            color: white;
            padding: 10px 24px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-save:hover {
            background: #092e4f;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            color: #6b7280;
            text-decoration: none;
            font-weight: 600;
            margin-bottom: 20px;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #0f4c81;
        }

        .notif {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 16px;
            font-size: 0.9rem;
            display: none;
        }

        .notif-success {
            background: #ecfdf5;
            color: #065f46;
            border: 1px solid #a7f3d0;
        }

        .notif-error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fecaca;
        }

        @media (max-width: 768px) {
            .profile-wrapper {
                grid-template-columns: 1fr;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: span 1;
            }
        }
    </style>
    <script>
        // Auth guard
        (function () {
            try { if (!localStorage.getItem('auth_token')) window.location.replace('/login'); } catch { window.location.replace('/login'); }
        })();
    </script>
</head>

<body>
    <div class="container">
        <header style="display:flex; justify-content:space-between; align-items:center;">
            <a href="javascript:history.back()" class="back-link"><i class="fa-solid fa-arrow-left"></i> Volver</a>
            <img src="/img/logo-cotecmar.png" alt="COTECMAR" style="height: 40px;" />
        </header>

        <div class="profile-wrapper">
            <!-- Left Sidebar -->
            <div class="profile-card profile-sidebar">
                <div class="avatar-upload" onclick="document.getElementById('avatarInput').click()">
                    <img id="avatarPreview" src="/img/default-avatar.png" class="avatar-img"
                        onerror="this.src='https://ui-avatars.com/api/?name=User&background=0f4c81&color=fff'" />
                    <div class="avatar-overlay">
                        <i class="fa-solid fa-camera"></i>
                    </div>
                    <input type="file" id="avatarInput" hidden accept="image/*">
                </div>
                <h2 class="user-name" id="userNameLabel">Cargando...</h2>
                <p class="user-role" id="userRoleLabel">Usuario</p>
                <div style="font-size:0.85rem; color:#6b7280;">
                    <i class="fa-solid fa-calendar-alt"></i> Miembro desde <span id="memberSince">...</span>
                </div>
            </div>

            <!-- Right Content -->
            <div class="profile-card">
                <div id="profileMsg" class="notif"></div>

                <form id="profileForm">
                    <h3 class="section-title"><i class="fa-solid fa-user-pen"></i> Información Personal</h3>

                    <div class="form-grid">
                        <div class="form-group">
                            <label>Nombre Completo</label>
                            <input type="text" id="name" class="form-input" placeholder="Nombre completo">
                        </div>
                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="text" id="phone" class="form-input" placeholder="+57 ...">
                        </div>
                        <div class="form-group full-width">
                            <label>Correo Electrónico</label>
                            <input type="email" id="email" class="form-input" disabled
                                style="background:#f3f4f6; cursor:not-allowed;">
                        </div>
                        <div class="form-group full-width">
                            <label>Biografía / Notas</label>
                            <textarea id="bio" class="form-input" placeholder="Breve descrición..."></textarea>
                        </div>
                    </div>

                    <div style="text-align:right;">
                        <button type="submit" class="btn-save" id="saveProfileBtn">
                            <i class="fa-solid fa-floppy-disk"></i> Guardar Cambios
                        </button>
                    </div>
                </form>

                <form id="passwordForm" style="margin-top: 40px;">
                    <h3 class="section-title"><i class="fa-solid fa-lock"></i> Seguridad</h3>

                    <div id="passMsg" class="notif"></div>

                    <div class="form-grid">
                        <div class="form-group full-width">
                            <label>Contraseña Actual</label>
                            <input type="password" id="currentPass" class="form-input" required>
                        </div>
                        <div class="form-group">
                            <label>Nueva Contraseña</label>
                            <input type="password" id="newPass" class="form-input" required minlength="6">
                        </div>
                        <div class="form-group">
                            <label>Confirmar Nueva</label>
                            <input type="password" id="confirmPass" class="form-input" required minlength="6">
                        </div>
                    </div>

                    <div style="text-align:right;">
                        <button type="submit" class="btn-save" id="changePassBtn" style="background:#dc2626;">
                            <i class="fa-solid fa-key"></i> Actualizar Contraseña
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        (async function () {
            const token = localStorage.getItem('auth_token');
            const API_URL = window.location.origin;

            // Elements
            const avatarInput = document.getElementById('avatarInput');
            const avatarPreview = document.getElementById('avatarPreview');
            const nameInput = document.getElementById('name');
            const phoneInput = document.getElementById('phone');
            const emailInput = document.getElementById('email');
            const bioInput = document.getElementById('bio');
            const userNameLabel = document.getElementById('userNameLabel');
            const memberSince = document.getElementById('memberSince');

            async function loadProfile() {
                try {
                    const res = await fetch('/api/users/me', { headers: { 'Authorization': `Bearer ${token}` } });
                    if (!res.ok) throw new Error('Failed to load');
                    const user = await res.json();

                    nameInput.value = user.name || '';
                    phoneInput.value = user.phone || '';
                    emailInput.value = user.email || '';
                    bioInput.value = user.bio || '';
                    userNameLabel.textContent = user.name || user.email.split('@')[0];

                    if (user.created_at) {
                        memberSince.textContent = new Date(user.created_at).toLocaleDateString();
                    }

                    if (user.profile_picture) {
                        avatarPreview.src = user.profile_picture;
                    } else {
                        avatarPreview.src = `https://ui-avatars.com/api/?name=${encodeURIComponent(user.name || 'User')}&background=0f4c81&color=fff`;
                    }
                } catch (e) {
                    console.error(e);
                }
            }

            // Upload Avatar
            avatarInput.addEventListener('change', async () => {
                const file = avatarInput.files[0];
                if (!file) return;

                const formData = new FormData();
                formData.append('file', file);

                try {
                    userNameLabel.textContent = "Subiendo...";
                    const res = await fetch('/api/users/me/profile-picture', {
                        method: 'POST',
                        headers: { 'Authorization': `Bearer ${token}` },
                        body: formData
                    });
                    if (res.ok) {
                        const user = await res.json();
                        if (user.profile_picture) avatarPreview.src = user.profile_picture + '?t=' + new Date().getTime();
                        userNameLabel.textContent = user.name || user.email;
                        // Update global storage maybe?
                        localStorage.setItem('user_avatar', user.profile_picture);
                    }
                } catch (e) {
                    alert('Error subiendo imagen');
                }
            });

            // Save Profile
            document.getElementById('profileForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const btn = document.getElementById('saveProfileBtn');
                const msg = document.getElementById('profileMsg');

                btn.disabled = true;
                btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Guardando...';

                try {
                    const res = await fetch('/api/users/me', {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            name: nameInput.value,
                            phone: phoneInput.value,
                            bio: bioInput.value
                        })
                    });

                    if (res.ok) {
                        const user = await res.json();
                        msg.className = 'notif notif-success';
                        msg.textContent = 'Perfil actualizado correctamente';
                        msg.style.display = 'block';
                        userNameLabel.textContent = user.name;
                        localStorage.setItem('user_name', user.name);
                    } else {
                        throw new Error();
                    }
                } catch {
                    msg.className = 'notif notif-error';
                    msg.textContent = 'Error al actualizar perfil';
                    msg.style.display = 'block';
                } finally {
                    setTimeout(() => { msg.style.display = 'none'; }, 3000);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Guardar Cambios';
                }
            });

            // Change Password
            document.getElementById('passwordForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const current = document.getElementById('currentPass').value;
                const newP = document.getElementById('newPass').value;
                const confirmP = document.getElementById('confirmPass').value;
                const msg = document.getElementById('passMsg');
                const btn = document.getElementById('changePassBtn');

                if (newP !== confirmP) {
                    msg.className = 'notif notif-error';
                    msg.textContent = 'Las contraseñas nuevas no coinciden';
                    msg.style.display = 'block';
                    return;
                }

                btn.disabled = true;
                btn.innerHTML = 'Actualizando...';

                try {
                    const res = await fetch('/api/users/me/password', {
                        method: 'PUT',
                        headers: {
                            'Authorization': `Bearer ${token}`,
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            current_password: current,
                            new_password: newP
                        })
                    });

                    const data = await res.json();

                    if (res.ok) {
                        msg.className = 'notif notif-success';
                        msg.textContent = 'Contraseña actualizada';
                        msg.style.display = 'block';
                        document.getElementById('passwordForm').reset();
                    } else {
                        throw new Error(data.detail || 'Error');
                    }
                } catch (err) {
                    msg.className = 'notif notif-error';
                    msg.textContent = err.message;
                    msg.style.display = 'block';
                } finally {
                    setTimeout(() => { msg.style.display = 'none'; }, 3000);
                    btn.disabled = false;
                    btn.innerHTML = '<i class="fa-solid fa-key"></i> Actualizar Contraseña';
                }
            });

            loadProfile();
        })();
    </script>
</body>

</html>
